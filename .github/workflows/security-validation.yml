name: Security dependency validation
on:
  workflow_dispatch:
  push:
    branches: [codex/security-20261027]
    paths: [.devcontainer/**, requirements-security.txt, .github/workflows/security-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Test the checked-out source with the development dependency lock
        run: docker buildx build --platform linux/amd64 --file .devcontainer/Dockerfile --target evidence --output type=local,dest=validation-output .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-validation
          path: validation-output/
          retention-days: 90
